spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:urban_ride}
    username: ${DB_USER:urban_admin}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:kafka:9092}
  jpa:
    hibernate:
      ddl-auto: validate
