apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urban-ride-ingress
  namespace: urban-ride
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: api.urbanride.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: urban-ride-backend-service
            port:
              number: 80
