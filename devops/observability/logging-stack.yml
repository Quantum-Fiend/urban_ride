version: '3.8'

services:
  loki:
    image: grafana/loki:2.9.2
    container_name: ridesphere-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - urban-ride-network

  promtail:
    image: grafana/promtail:2.9.2
    container_name: ridesphere-promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - urban-ride-network

networks:
  urban-ride-network:
    external: true
